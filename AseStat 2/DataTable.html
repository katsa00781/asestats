<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASEStats — DataTable Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
/* ============================================================
   Tokenek — globals.css-ből inline-olva
   ============================================================ */
:root {
  --bg-base: #050B14;
  --bg-surface-1: #0A1628;
  --bg-surface-2: #0F1F3D;
  --bg-surface-3: #162440;

  --accent-cyan: #00D4FF;
  --accent-cyan-dim: #0096B8;
  --accent-orange: #FF6B35;
  --accent-ai: #7C3AED;

  --text-primary: #E8F4FF;
  --text-secondary: #5A7A99;
  --text-muted: #2D4A6B;

  --positive: #10D98A;
  --negative: #FF4757;
  --warning: #FFB627;

  --border-subtle: #0F2040;
  --border-active: #1E3A5F;
  --border-strong: #2A4A75;

  --glow-cyan: rgba(0, 212, 255, 0.18);
  --glow-cyan-hot: rgba(0, 212, 255, 0.45);
  --glow-positive: rgba(16, 217, 138, 0.18);
  --glow-negative: rgba(255, 71, 87, 0.18);

  --font-display: "Barlow Condensed", system-ui, sans-serif;
  --font-sans: "Barlow", "DM Sans", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --ease-snap: cubic-bezier(.2, .8, .2, 1);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body {
  background-image:
    radial-gradient(circle at 1px 1px, rgba(0,212,255,0.045) 1px, transparent 0),
    radial-gradient(1200px 600px at 20% -10%, rgba(0,212,255,.05), transparent 60%),
    radial-gradient(900px 500px at 95% 110%, rgba(255,107,53,.04), transparent 60%);
  background-size: 24px 24px, 100% 100%, 100% 100%;
  background-attachment: fixed;
  padding: 48px 40px 96px;
}

/* ============================================================
   PAGE HEADER + LAYOUT
   ============================================================ */
.page {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 56px;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border-active);
}
.page-eyebrow {
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.72rem;
  color: var(--accent-cyan);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 2.4rem;
  letter-spacing: -0.01em;
  line-height: 1;
}
.page-sub {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 12px;
  max-width: 56ch;
  line-height: 1.55;
}
.page-meta {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  text-align: right;
  line-height: 1.5;
}
.page-meta b { color: var(--text-secondary); font-weight: 500; }

/* Section frame for each table demo */
.section {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.section-title-row {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.section-num {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}
.section-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.35rem;
  letter-spacing: -0.005em;
}
.section-desc {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-secondary);
}
.section-tools {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* Filter chips above tables */
.chip {
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.7rem;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-1);
  border: 1px solid var(--border-active);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 160ms var(--ease-snap);
}
.chip:hover { color: var(--text-primary); border-color: var(--accent-cyan-dim); }
.chip[data-active="true"] {
  background: color-mix(in oklab, var(--accent-cyan) 12%, transparent);
  color: var(--accent-cyan);
  border-color: color-mix(in oklab, var(--accent-cyan) 40%, transparent);
}

.input-cmd {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-active);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  border-radius: var(--radius-sm);
  padding: 6px 10px 6px 28px;
  width: 220px;
  position: relative;
}
.input-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.input-wrap svg {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}
.input-cmd:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent-cyan) 18%, transparent);
}

/* ============================================================
   DATATABLE — wrapper rendszer
   ============================================================ */

/* Külső wrapper: kerek sarok + clip + halvány glow lehetősége */
.dt-shell {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
}

/* Görgethető konténer — vízszintes scroll mobil/tablet alatt */
.dt-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-active) transparent;
}
.dt-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
.dt-scroll::-webkit-scrollbar-track { background: var(--bg-surface-1); }
.dt-scroll::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }

/* A tábla maga */
.dt-table {
  width: 100%;
  border-collapse: collapse;
  border-spacing: 0;
  font-family: var(--font-body);
}

/* -------- FEJLÉC ---------------------------------------------- */
.dt-table thead tr {
  background: var(--bg-surface-2);
  border-bottom: 1px solid var(--border-active);
}
.dt-th {
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.7rem;
  color: var(--text-muted);
  padding: 14px 14px;
  text-align: left;
  white-space: nowrap;
  user-select: none;
  position: relative;
}
.dt-th[data-num="true"] { text-align: right; font-family: var(--font-mono); letter-spacing: 0.04em; }
.dt-th[data-center="true"] { text-align: center; }
.dt-th[data-sortable="true"] { cursor: pointer; transition: color 140ms var(--ease-snap); }
.dt-th[data-sortable="true"]:hover { color: var(--text-secondary); }
.dt-th[data-sorted] { color: var(--accent-cyan); }

/* Sort ikon konténer — kattintásra forog */
.dt-sort {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dt-th[data-num="true"] .dt-sort { flex-direction: row-reverse; }
.dt-sort-icon {
  width: 12px;
  height: 12px;
  transition: transform 220ms var(--ease-snap), opacity 140ms var(--ease-snap);
  opacity: 0.35;
  flex-shrink: 0;
}
.dt-th[data-sorted] .dt-sort-icon { opacity: 1; color: var(--accent-cyan); }
.dt-th[data-sorted="desc"] .dt-sort-icon { transform: rotate(180deg); }

/* -------- BODY ROWS ------------------------------------------- */
.dt-table tbody tr {
  border-bottom: 1px solid var(--border-subtle);
  transition: background 150ms var(--ease-snap),
              box-shadow 150ms var(--ease-snap);
  position: relative;
}
.dt-table tbody tr:last-child { border-bottom: none; }

/* Hover: surface-2 + bal oldali 2px cián border (inset shadow trükkel) */
.dt-table tbody tr:hover {
  background: var(--bg-surface-2);
  box-shadow: inset 2px 0 0 0 var(--accent-cyan);
}
/* Aktív / kijelölt sor — állandó cián marker */
.dt-table tbody tr[data-active="true"] {
  background: var(--bg-surface-2);
  box-shadow: inset 2px 0 0 0 var(--accent-cyan),
              0 0 24px -4px var(--glow-cyan);
}

.dt-td {
  padding: 14px 14px;
  font-size: 0.86rem;
  color: var(--text-primary);
  vertical-align: middle;
  white-space: nowrap;
}

/* -------- CELL TÍPUSOK ---------------------------------------- */

/* Numerikus cella — JetBrains Mono, jobbra zárva */
.dt-num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum", "zero";
  text-align: right;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.dt-num--muted { color: var(--text-secondary); }
.dt-num--strong { color: var(--accent-cyan); font-weight: 600; }
.dt-num--pos { color: var(--positive); }
.dt-num--neg { color: var(--negative); }

/* Index / rank cella */
.dt-rank {
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-size: 0.78rem;
  width: 44px;
  text-align: right;
  padding-right: 4px;
}

/* Játékos név cella */
.dt-player {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.dt-player-avatar {
  width: 30px;
  height: 30px;
  border-radius: 999px;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-active);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.72rem;
  color: var(--text-secondary);
  letter-spacing: 0.05em;
  flex-shrink: 0;
}
.dt-player-name {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--accent-cyan);
  cursor: pointer;
  transition: color 140ms var(--ease-snap);
}
.dt-player-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.dt-player-meta {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-top: 2px;
  letter-spacing: 0.04em;
}

/* Team cella — kis logó + rövid kód */
.dt-team {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.dt-team-logo {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-active);
  background: var(--bg-surface-3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.66rem;
  letter-spacing: 0.04em;
  color: var(--text-primary);
}
.dt-team-name {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--text-primary);
}

/* Badge pill */
.dt-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.66rem;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid transparent;
  min-width: 28px;
}
.dt-badge--win {
  background: color-mix(in oklab, var(--positive) 14%, transparent);
  color: var(--positive);
  border-color: color-mix(in oklab, var(--positive) 36%, transparent);
}
.dt-badge--loss {
  background: color-mix(in oklab, var(--negative) 14%, transparent);
  color: var(--negative);
  border-color: color-mix(in oklab, var(--negative) 36%, transparent);
}
.dt-badge--pg { background: color-mix(in oklab, var(--accent-cyan) 14%, transparent); color: var(--accent-cyan); border-color: color-mix(in oklab, var(--accent-cyan) 36%, transparent); }
.dt-badge--sg { background: color-mix(in oklab, #38BDF8 16%, transparent); color: #7DD3FC; border-color: color-mix(in oklab, #38BDF8 36%, transparent); }
.dt-badge--sf { background: color-mix(in oklab, var(--warning) 14%, transparent); color: var(--warning); border-color: color-mix(in oklab, var(--warning) 36%, transparent); }
.dt-badge--pf { background: color-mix(in oklab, var(--accent-orange) 14%, transparent); color: var(--accent-orange); border-color: color-mix(in oklab, var(--accent-orange) 36%, transparent); }
.dt-badge--c  { background: color-mix(in oklab, var(--accent-ai) 18%, transparent); color: #C4B5FD; border-color: color-mix(in oklab, var(--accent-ai) 42%, transparent); }
.dt-badge--neutral {
  background: var(--bg-surface-2);
  color: var(--text-secondary);
  border-color: var(--border-active);
}

/* Trend chip — pozitív/negatív delta */
.dt-trend {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.dt-trend--up { color: var(--positive); }
.dt-trend--down { color: var(--negative); }
.dt-trend--flat { color: var(--text-muted); }

/* Mini bar a táblában (pl. shooting %) */
.dt-bar {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 160px;
}
.dt-bar-track {
  flex: 1;
  height: 4px;
  background: var(--bg-surface-3);
  border-radius: 999px;
  overflow: hidden;
  min-width: 60px;
}
.dt-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-cyan-dim), var(--accent-cyan));
  border-radius: 999px;
}
.dt-bar-fill--orange { background: linear-gradient(90deg, #B84A22, var(--accent-orange)); }
.dt-bar-val {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.76rem;
  color: var(--text-secondary);
  min-width: 38px;
  text-align: right;
}

/* Streak vizualizáció — kis pöttyök sorozata */
.dt-streak {
  display: inline-flex;
  gap: 3px;
}
.dt-streak-dot {
  width: 6px;
  height: 14px;
  border-radius: 1px;
  background: var(--bg-surface-3);
}
.dt-streak-dot--w { background: var(--positive); box-shadow: 0 0 6px var(--glow-positive); }
.dt-streak-dot--l { background: var(--negative); box-shadow: 0 0 6px var(--glow-negative); }

/* Footer pagination strip */
.dt-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-surface-1);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}
.dt-foot-pager { display: inline-flex; align-items: center; gap: 4px; }
.dt-foot-btn {
  background: transparent;
  border: 1px solid var(--border-active);
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 140ms var(--ease-snap);
}
.dt-foot-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan-dim); }
.dt-foot-btn[data-active="true"] {
  background: color-mix(in oklab, var(--accent-cyan) 14%, transparent);
  color: var(--accent-cyan);
  border-color: color-mix(in oklab, var(--accent-cyan) 40%, transparent);
}

/* ============================================================
   CODE PANEL — komponens példa szerelv
   ============================================================ */
.code-panel {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.code-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-surface-2);
  border-bottom: 1px solid var(--border-active);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.code-panel-head b { color: var(--accent-cyan); font-weight: 600; }
.code-panel pre {
  margin: 0;
  padding: 18px 20px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  line-height: 1.65;
  color: var(--text-primary);
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
}
.tk { color: #C4B5FD; }       /* keyword */
.ts { color: #FBBF24; }       /* string */
.tt { color: var(--accent-cyan); } /* type / tag */
.tc { color: var(--text-muted); }  /* comment */
.tp { color: var(--positive); }    /* prop */
.tn { color: #F472B6; }       /* function name */

/* Misc */
.hr-cap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
}
.hr-cap span {
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-size: 0.68rem;
  color: var(--text-muted);
}
.hr-cap::before, .hr-cap::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
}
</style>
</head>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ============================================================
   IKONOK
   ============================================================ */
function ChevronUp({ className = "dt-sort-icon" }) {
  return (
    <svg className={className} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  );
}
function SearchIcon() {
  return (
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  );
}
function TrendUp() {
  return (
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="6 15 12 9 18 15"></polyline>
    </svg>
  );
}
function TrendDown() {
  return (
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  );
}

/* ============================================================
   GENERIKUS DATATABLE KOMPONENS
   ============================================================ */
function DataTable({ columns, rows, initialSort, activeRowId, getRowId, footer }) {
  const [sort, setSort] = useState(initialSort || { key: null, dir: "asc" });

  const sortedRows = useMemo(() => {
    if (!sort.key) return rows;
    const col = columns.find(c => c.key === sort.key);
    const accessor = col?.sortAccessor || (r => r[sort.key]);
    const dir = sort.dir === "asc" ? 1 : -1;
    return [...rows].sort((a, b) => {
      const av = accessor(a), bv = accessor(b);
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
      return String(av).localeCompare(String(bv), "hu") * dir;
    });
  }, [rows, sort, columns]);

  function toggleSort(key) {
    setSort(s => {
      if (s.key !== key) return { key, dir: "desc" };
      if (s.dir === "desc") return { key, dir: "asc" };
      return { key: null, dir: "asc" };
    });
  }

  return (
    <div className="dt-shell">
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              {columns.map(col => {
                const sorted = sort.key === col.key ? sort.dir : undefined;
                return (
                  <th
                    key={col.key}
                    className="dt-th"
                    data-num={col.numeric ? "true" : undefined}
                    data-center={col.center ? "true" : undefined}
                    data-sortable={col.sortable !== false ? "true" : undefined}
                    data-sorted={sorted}
                    style={col.width ? { width: col.width } : undefined}
                    onClick={() => col.sortable !== false && toggleSort(col.key)}
                  >
                    <span className="dt-sort">
                      <span>{col.label}</span>
                      {col.sortable !== false && <ChevronUp />}
                    </span>
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {sortedRows.map((row, idx) => {
              const id = getRowId ? getRowId(row) : idx;
              const isActive = activeRowId != null && id === activeRowId;
              return (
                <tr key={id} data-active={isActive ? "true" : undefined}>
                  {columns.map(col => (
                    <td
                      key={col.key}
                      className={`dt-td ${col.cellClassName || ""}`}
                      style={col.numeric ? { textAlign: "right" } : col.center ? { textAlign: "center" } : undefined}
                    >
                      {col.render ? col.render(row, idx) : row[col.key]}
                    </td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {footer && <div className="dt-foot">{footer}</div>}
    </div>
  );
}

/* ============================================================
   POS BADGE + W/L BADGE HELPERS
   ============================================================ */
function PosBadge({ pos }) {
  const cls = {
    PG: "dt-badge--pg",
    SG: "dt-badge--sg",
    SF: "dt-badge--sf",
    PF: "dt-badge--pf",
    C:  "dt-badge--c",
  }[pos] || "dt-badge--neutral";
  return <span className={`dt-badge ${cls}`}>{pos}</span>;
}
function WLBadge({ res }) {
  if (res === "W") return <span className="dt-badge dt-badge--win">GY</span>;
  return <span className="dt-badge dt-badge--loss">V</span>;
}
function PlayerCell({ row }) {
  const initials = (row.first[0] + row.last[0]).toUpperCase();
  return (
    <div className="dt-player">
      <span className="dt-player-avatar">{initials}</span>
      <span>
        <span className="dt-player-name">{row.last} {row.first}</span>
        <span className="dt-player-meta">#{row.no} · {row.team}</span>
      </span>
    </div>
  );
}
function TeamCell({ code, name }) {
  return (
    <div className="dt-team">
      <span className="dt-team-logo">{code}</span>
      <span className="dt-team-name">{name}</span>
    </div>
  );
}
function Streak({ list }) {
  return (
    <span className="dt-streak">
      {list.map((s, i) => (
        <span key={i} className={`dt-streak-dot ${s === "W" ? "dt-streak-dot--w" : "dt-streak-dot--l"}`}></span>
      ))}
    </span>
  );
}
function ShootingBar({ pct, variant }) {
  return (
    <div className="dt-bar">
      <span className="dt-bar-track">
        <span className={`dt-bar-fill ${variant === "orange" ? "dt-bar-fill--orange" : ""}`} style={{ width: `${pct}%` }}></span>
      </span>
      <span className="dt-bar-val">{pct.toFixed(1)}%</span>
    </div>
  );
}
function PlusMinus({ v }) {
  const cls = v > 0 ? "dt-num--pos" : v < 0 ? "dt-num--neg" : "dt-num--muted";
  return <span className={`dt-num ${cls}`}>{v > 0 ? "+" : ""}{v.toFixed(1)}</span>;
}

  <span class="tp">render</span>?: (<span class="tp">row</span>: <span class="tt">T</span>, <span class="tp">idx</span>: <span class="tk">number</span>) =&gt; <span class="tt">React.ReactNode</span>;
};

<span class="tk">export function</span> <span class="tn">DataTable</span>&lt;<span class="tt">T</span>&gt;({
  columns, rows, initialSort, activeRowId, getRowId, footer,
}: {
  <span class="tp">columns</span>: <span class="tt">ColumnDef</span>&lt;<span class="tt">T</span>&gt;[];
  <span class="tp">rows</span>: <span class="tt">T</span>[];
  <span class="tp">initialSort</span>?: { <span class="tp">key</span>: <span class="tk">string</span>; <span class="tp">dir</span>: <span class="tt">SortDir</span> };
  <span class="tp">activeRowId</span>?: <span class="tk">string</span> | <span class="tk">number</span>;
  <span class="tp">getRowId</span>?: (<span class="tp">row</span>: <span class="tt">T</span>) =&gt; <span class="tk">string</span> | <span class="tk">number</span>;
  <span class="tp">footer</span>?: <span class="tt">React.ReactNode</span>;
}) {
  <span class="tk">const</span> [sort, setSort] = <span class="tn">useState</span>(initialSort ?? { key: <span class="tk">null</span>, dir: <span class="ts">"asc"</span> });

  <span class="tk">const</span> sortedRows = <span class="tn">useMemo</span>(() =&gt; { <span class="tc">/* …same as JS demo… */</span> }, [rows, sort]);

  <span class="tk">function</span> <span class="tn">toggleSort</span>(key: <span class="tk">string</span>) {
    setSort(s =&gt; s.key !== key
      ? { key, dir: <span class="ts">"desc"</span> }
      : s.dir === <span class="ts">"desc"</span> ? { key, dir: <span class="ts">"asc"</span> } : { key: <span class="tk">null</span>, dir: <span class="ts">"asc"</span> });
  }

  <span class="tk">return</span> (
    &lt;<span class="tt">div</span> <span class="tp">className</span>=<span class="ts">"dt-shell"</span>&gt;
      &lt;<span class="tt">div</span> <span class="tp">className</span>=<span class="ts">"dt-scroll"</span>&gt;
        &lt;<span class="tt">table</span> <span class="tp">className</span>=<span class="ts">"dt-table"</span>&gt;
          &lt;<span class="tt">thead</span>&gt;&lt;<span class="tt">tr</span>&gt;
            {columns.map(col =&gt; {
              <span class="tk">const</span> sorted = sort.key === col.key ? sort.dir : <span class="tk">undefined</span>;
              <span class="tk">return</span> (
                &lt;<span class="tt">th</span>
                  <span class="tp">key</span>={col.key}
                  <span class="tp">className</span>=<span class="ts">"dt-th"</span>
                  <span class="tp">data-num</span>={col.numeric || <span class="tk">undefined</span>}
                  <span class="tp">data-center</span>={col.center || <span class="tk">undefined</span>}
                  <span class="tp">data-sortable</span>={col.sortable !== <span class="tk">false</span> || <span class="tk">undefined</span>}
                  <span class="tp">data-sorted</span>={sorted}
                  <span class="tp">onClick</span>={() =&gt; col.sortable !== <span class="tk">false</span> && <span class="tn">toggleSort</span>(col.key)}
                &gt;
                  &lt;<span class="tt">span</span> <span class="tp">className</span>=<span class="ts">"dt-sort"</span>&gt;
                    &lt;<span class="tt">span</span>&gt;{col.label}&lt;/<span class="tt">span</span>&gt;
                    {col.sortable !== <span class="tk">false</span> && &lt;<span class="tt">ChevronUp</span> <span class="tp">className</span>=<span class="ts">"dt-sort-icon"</span> /&gt;}
                  &lt;/<span class="tt">span</span>&gt;
                &lt;/<span class="tt">th</span>&gt;
              );
            })}
          &lt;/<span class="tt">tr</span>&gt;&lt;/<span class="tt">thead</span>&gt;
          &lt;<span class="tt">tbody</span>&gt;
            {sortedRows.map((row, idx) =&gt; {
              <span class="tk">const</span> id = getRowId?.(row) ?? idx;
              <span class="tk">const</span> isActive = activeRowId === id;
              <span class="tk">return</span> (
                &lt;<span class="tt">tr</span> <span class="tp">key</span>={id} <span class="tp">data-active</span>={isActive || <span class="tk">undefined</span>}&gt;
                  {columns.map(col =&gt; (
                    &lt;<span class="tt">td</span> <span class="tp">key</span>={col.key} <span class="tp">className</span>=<span class="ts">"dt-td"</span>&gt;
                      {col.render ? col.render(row, idx) : (row <span class="tk">as any</span>)[col.key]}
                    &lt;/<span class="tt">td</span>&gt;
                  ))}
                &lt;/<span class="tt">tr</span>&gt;
              );
            })}
          &lt;/<span class="tt">tbody</span>&gt;
        &lt;/<span class="tt">table</span>&gt;
      &lt;/<span class="tt">div</span>&gt;
      {footer && &lt;<span class="tt">div</span> <span class="tp">className</span>=<span class="ts">"dt-foot"</span>&gt;{footer}&lt;/<span class="tt">div</span>&gt;}
    &lt;/<span class="tt">div</span>&gt;
  );
}`}</pre>
